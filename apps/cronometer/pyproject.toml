[project]
name = "cronometer"
version = "1.0.0"
description = "Cronometer food diary MCP for Leon's agents, as a Cloudflare Python Worker."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # What the upstream in src/cronometer_mcp declares (its SOCKS proxy extra isn't used here).
  "mcp>=1.30.0,<2",
  "httpx>=0.27.0",
  # Upstream works in the account's time zone, and Python has no time zone data of its own here.
  "tzdata",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
