name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vpr -w typecheck
      - run: vpr -w test
      - run: vpr -w build:hermes-plugins
      - run: git diff --exit-code -- 'apps/hermes-plugin-*/policy.cjs'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test Hermes plugins
        run: |
          uv run --no-project --python 3.14 --with pythonmonkey==1.5.1 --with cryptography --with pytest python -m pytest \
            --rootdir=. --import-mode=importlib \
            apps/hermes-plugin-dropbox-task-memory/__tests__ \
            apps/hermes-plugin-slack22orca/__tests__ \
            apps/hermes-plugin-hermes22muse/__tests__
      - run: vp build

  # Pushes to main deploy the Cloudflare Workers they changed, once the checks above pass.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
