name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vpr -w typecheck
      - run: vpr -w test
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/beeperd/go.mod
          cache-dependency-path: apps/beeperd/go.sum
      - run: vpr -w vet:beeperd
      - run: vpr -w test:beeperd
      - run: vpr -w build:hermes-plugins
      - run: git diff --exit-code -- 'apps/hermes-plugin-*/policy.cjs' 'apps/hermes-plugin-*/*/policy.cjs' packages/ai/leonsilicon/configs/hermes-mirrors/bridge.cjs
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test Hermes plugins
        run: |
          uv run --no-project --python 3.14 --with pygls==2.1.1 --with cryptography --with fastapi --with httpx --with pytest python -m pytest \
            --rootdir=. --import-mode=importlib \
            packages/ai/leonsilicon/configs/hermes-mirrors/__tests__ \
            apps/hermes-plugin-autodeploy/__tests__ \
            apps/hermes-plugin-leon/__tests__/test_leon.py \
            apps/hermes-plugin-leon/__tests__/test_dropbox_task_memory.py \
            apps/hermes-plugin-leon/__tests__/test_grok_box_browser.py \
            apps/hermes-plugin-leon/__tests__/test_slack22orca.py \
            apps/hermes-plugin-leon/__tests__/test_hermes22muse.py \
            apps/muse-gadget/__tests__
      - run: vp build

  # Pushes to main deploy the Cloudflare Workers they changed, once the checks above pass.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
