name: Deploy

# Deploys the Cloudflare Workers (ai-edge, linear-slack-sync, slack-as-leon / slack-puppet) whose code
# changed since the last successful run on main, and publishes the Todoist Automations on every run. CI
# calls this after its checks pass on a push to main; it can also be run by hand (Actions → Deploy → Run
# workflow) for all or chosen Workers. The Mac mini services and Hermes Cloud are deployed by hand
# (DEVELOPMENT.md).
#
# Secrets live in the `production` environment, which only main can use: CLOUDFLARE_API_TOKEN (an
# account-owned token: Workers Scripts edit, Workers Routes edit on leonsilicon.ai, Connectivity
# Directory bind for ai-edge's VPC service, Account Settings read), INFISICAL_CLIENT_ID and
# INFISICAL_CLIENT_SECRET (varlock resolves #slack-as-leon / #linear-slack-sync / #todoist-automations,
# Todoist's API token included, from Infisical), and the CLOUDFLARE_ACCOUNT_ID variable.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      workers:
        description: "Workers to deploy: all, or a comma-separated list (ai-edge, linear-slack-sync, slack-as-leon)"
        required: true
        default: all

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      # The newest push to main whose CI run (checks and deploy) succeeded. Diffing against it, rather
      # than against the push's own `before`, means a failed deploy is retried by the next push.
      - name: Find the last successful deploy
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Choose the Workers
        id: plan
        env:
          BASE: ${{ steps.base.outputs.sha }}
          ONLY: ${{ inputs.workers }}
        run: |
          targets=packages/com/leonsilicon/ai/configs/deploy-targets/_deploy-targets.ts
          if [ -n "$ONLY" ]; then
            node "$targets" --only "$ONLY" --github-output
          elif [ -n "$BASE" ]; then
            node "$targets" --base "$BASE" --head HEAD --github-output
          else
            node "$targets" --all --github-output
          fi

  deploy:
    needs: plan
    if: needs.plan.outputs.workers != '[]'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
    # One deploy per Worker at a time; a newer push waits rather than cancelling one mid-upload.
    concurrency:
      group: deploy-${{ matrix.worker }}
      cancel-in-progress: false
    env:
      WORKER: ${{ matrix.worker }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      # Fails rather than skips: a run that deployed nothing must not count as the last good deploy.
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Not deployed::Add the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to the production environment (see the comment at the top of deploy.yml); $WORKER was not deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      # Typechecks, builds www/ and deploys; the varlock ones also upload the Worker's vars and secrets.
      - run: vpr -w "deploy:$WORKER"

  # The repo is the Todoist Automations' source of truth. Every run publishes each manifest in
  # packages/com/leonsilicon/ai/configs/todoist-automations/@assets that Todoist doesn't match, which
  # overwrites an edit made in Todoist since (pull it into the repo first to keep it). Automations
  # that aren't in the repo are left alone, with a warning. Nothing it logs holds the private values.
  todoist-automations:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-todoist-automations
      cancel-in-progress: false
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: node packages/com/leonsilicon/ai/configs/todoist-automations/_todoist-automations.ts push --yes
